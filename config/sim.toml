# ---------------------------------------------------------------------------
# AE4803 PySim - simulation configuration
# ---------------------------------------------------------------------------

[solver]
# Fixed-step RK4, paced against the wall clock. The Simulink model used a
# variable-step ode23 at RelTol 1e-2 with simulation pacing at 1x; a fixed step
# is what makes the timing predictable and measurable.
# 200 Hz uses ~19% of the step budget on this machine; 100 Hz uses ~10%.
rate_hz = 200.0
# Steps of accumulated lag to work off before resyncing the clock, so a
# transient hiccup cannot turn into permanent lag.
max_catchup_steps = 5
# Per-user Windows timing tweaks. Neither needs administrator rights, and the
# sim runs correctly if either is refused.
high_priority = true
timer_resolution_ms = 1

[model]
# Inertia tensor to integrate with.
#
#   "symmetric_neg"  DEFAULT. -Jxz in both off-diagonal slots. A physically
#                    realizable tensor.
#   "symmetric_pos"  +Jxz in both slots. Also realizable; differs from
#                    symmetric_neg by ~2 % of signal scale in the lateral
#                    states. The sign is NOT confirmed - see below.
#   "simulink"       Bug-for-bug with AE4803Sim.slx, whose mask holds an
#                    ASYMMETRIC matrix (+117.64 at (1,3), -117.64 at (3,1)).
#                    That is not a possible inertia tensor, and no rigid body
#                    reproduces the dynamics it produces. Use this - and only
#                    this - when comparing against the Simulink model.
#
# NOTE, and it matters: with the default the Python sim no longer matches
# AE4803Sim.slx exactly. It differs by roughly 1 % of signal scale in roll,
# yaw and sideslip, deliberately, because the .slx is integrating an impossible
# rigid body. tools/replay_compare.py and tools/convergence_check.py pin
# themselves to "simulink" so the port is still validated honestly.
#
# The SIGN of the symmetric value is unconfirmed. symmetric_neg follows the FDC
# moment-equation convention, but that reading has not been checked against
# Rauw's thesis, and the sign is worth ~2 % - more than the asymmetry it fixes.
# Full evidence in docs/MODEL_NOTES.md section 2.1.
inertia_mode = "symmetric_neg"

[autopilot]
# Both default off, matching wingLevelerOn / altitudeHoldOn in sim_init.mat.
# Toggle them live from the GUI.
wing_leveler = false
altitude_hold = false
# "capture"         - latch the altitude reference when the hold is engaged.
# "simulink_memory" - reproduce the Memory block's 0 initial condition, which
#                     makes the reference 0 ft if the hold is on at t = 0.
altitude_ref_mode = "capture"

[autostop]
enabled = true
# The model's altitude test is `abs(alt_ft) < 0`, which can never be true, so a
# crash never stops it. Set true to use the evidently-intended `alt_ft < 0`.
fix_altitude_test = false

[xplane]
enabled = true
ip = "127.0.0.1"
port = 49000
# "vehx"          - what AE4803Sim.slx actually sends (VEHX + DREF on 49000).
# "legacy_string" - the older "phi theta psi lat lon alt" string for the
#                   UWTimedProcessingUDP.xpl plugin; set port = 49003 with this.
protocol = "vehx"
send_datarefs = true
rate_hz = 30.0
legacy_digits = 10

# Drive X-Plane's 3D cockpit instruments too. VEHX only places the aircraft;
# the panel's airspeed/VSI/tach/manifold gauges come from X-Plane's own flight
# model, which we are bypassing, so we write them explicitly.
send_instruments = true
# Not every cockpit dataref is writable - some are recomputed each frame and
# ignore writes. Run `python tools/xplane_dref_probe.py` with X-Plane open to
# measure which ones stick, then paste its output here to send only those.
# Empty list = send them all.
instrument_allowlist = []

[logging]
enabled = true
directory = "flightlogs"
# Record every Nth physics step. At 200 Hz, 4 gives 50 Hz logs - plenty for
# post-processing and keeps the .mat to a sensible size.
decimate = 4
# Also copy the sim_init.mat parameters into the log, as the StopFcn did.
include_parameters = true

[wind]
# AE4803Sim has turbulence switched OFF (Dryden T_on = off, wind shear W_20 = 0,
# all gust axes off), so the wind is identically zero. Enable for an experiment.
turbulence = false
W20 = 5.0
seed = 23341
